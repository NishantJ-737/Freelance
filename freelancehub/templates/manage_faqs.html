{% extends "base.html" %}
{% block title %}Manage FAQs — {{ service.title }}{% endblock %}
{% block content %}
<div class="fh-page-banner" style="padding:28px 0;">
  <div class="container" style="max-width:800px;margin:0 auto;padding:0 20px;position:relative;z-index:1;">
    <a href="{{ url_for('service_detail', service_id=service.id) }}" style="color:rgba(255,255,255,.5);font-size:13px;text-decoration:none;">← Back to service</a>
    <h1 style="font-family:var(--font-display);font-size:1.8rem;font-weight:800;color:white;margin-top:8px;">Manage FAQs</h1>
    <p style="color:rgba(255,255,255,.5);font-size:13px;">{{ service.title }}</p>
  </div>
</div>
<div class="section-pad">
  <div class="container" style="max-width:800px;margin:0 auto;padding:0 20px;">
    <form method="POST" id="faqForm">
      <div id="faqList">
        {% for faq in faqs %}
        <div class="fh-panel faq-row" style="margin-bottom:16px;position:relative;">
          <button type="button" onclick="this.closest('.faq-row').remove()"
                  style="position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text-soft);cursor:pointer;font-size:18px;">×</button>
          <div style="margin-bottom:10px;">
            <label style="font-size:12px;font-weight:600;color:var(--text-soft);text-transform:uppercase;">Question</label>
            <input type="text" name="question" value="{{ faq.question }}" class="fh-input" required placeholder="e.g. Do you offer revisions?" />
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;color:var(--text-soft);text-transform:uppercase;">Answer</label>
            <textarea name="answer" class="fh-textarea" required placeholder="Your answer...">{{ faq.answer }}</textarea>
          </div>
        </div>
        {% endfor %}
      </div>
      <button type="button" id="addFaq" class="btn-outline-fh" style="width:100%;margin-bottom:20px;">
        <i class="bi bi-plus-circle"></i> Add FAQ
      </button>
      <button type="submit" class="btn-primary-fh" style="width:100%;">Save FAQs</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const tmpl = `<div class="fh-panel faq-row" style="margin-bottom:16px;position:relative;">
  <button type="button" onclick="this.closest('.faq-row').remove()" style="position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text-soft);cursor:pointer;font-size:18px;">×</button>
  <div style="margin-bottom:10px;"><label style="font-size:12px;font-weight:600;color:var(--text-soft);text-transform:uppercase;">Question</label>
  <input type="text" name="question" class="fh-input" required placeholder="e.g. Do you offer revisions?"/></div>
  <div><label style="font-size:12px;font-weight:600;color:var(--text-soft);text-transform:uppercase;">Answer</label>
  <textarea name="answer" class="fh-textarea" required placeholder="Your answer..."></textarea></div>
</div>`;
document.getElementById('addFaq').addEventListener('click', () => {
  document.getElementById('faqList').insertAdjacentHTML('beforeend', tmpl);
});
</script>
{% endblock %}
